apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microk8s-components
  namespace: argocd
  labels:
    owner: seanmccorkle
    type: dynamic-app-of-apps
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    # Git Files generator - reads application config from each app directory
    - git:
        repoURL: git@github.com:seanmccorkle/microk8s-components.git
        revision: main
        files:
          - path: "apps/*/config.yaml"

  template:
    metadata:
      name: '{{.name}}'
      labels:
        owner: seanmccorkle
        environment: sandbox
    spec:
      project: '{{.project | default "default"}}'
      source:
        repoURL: '{{.source.repoURL}}'
        targetRevision: '{{.source.targetRevision}}'
        path: '{{.source.path}}'
      destination:
        server: '{{.destination.server}}'
        namespace: '{{.destination.namespace}}'
      syncPolicy:
        # automated:
        #   prune: true
        #   selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true  # Deletes namespace last (after all resources)

