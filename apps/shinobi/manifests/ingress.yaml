---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shinobi-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: shinobi-shinobi-buffering@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: shinobi.local # map this to your public domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shinobi-service
            port:
              number: 8080
