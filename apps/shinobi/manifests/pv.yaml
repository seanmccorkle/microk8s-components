---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shinobi-pv
  labels:
    app: shinobi
spec:
  capacity:
    storage: 1000Gi  # Adjust to match your available disk space
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain  # Keep data if PVC is deleted
  storageClassName: local-storage
  hostPath:
    path: /mnt/storage/shinobi  # Host path where videos will be stored
    type: DirectoryOrCreate  # Creates directory if it doesn't exist
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - uno
