---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shinobi-db-pv
  labels:
    app: shinobi
spec:
  capacity:
    storage: 20Gi  # Database storage - adjust as needed
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain  # Keep data if PVC is deleted
  storageClassName: shinobi-sc
  hostPath:
    path: /mnt/storage/shinobi-db  # Host path for database
    type: DirectoryOrCreate  # Creates directory if it doesn't exist
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - uno
