name: shinobi
project: default
annotations:
  argocd.argoproj.io/sync-wave: "10"
source:
  repoURL: git@github.com:seanmccorkle/microk8s-components.git
  targetRevision: main
  path: apps/shinobi
  kustomize:
    version: v5.0.0
destination:
  server: https://kubernetes.default.svc
  namespace: shinobi
syncPolicy:
  # automated:
  #   prune: true
  #   selfHeal: true
  syncOptions:
    - CreateNamespace=true
