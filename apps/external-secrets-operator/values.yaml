# External Secrets Operator Helm Values for v2.15.0

# Don't install CRDs via Helm - they're too large and exceed annotation size limits
# Install manually
# kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/external-secrets/external-secrets/main/deploy/crds/bundle.yaml
installCRDs: false

# Single replica for microk8s
replicaCount: 1

# Image configuration
image:
  repository: ghcr.io/external-secrets/external-secrets
  pullPolicy: IfNotPresent

# Resource limits for main controller
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 256Mi

# Security context for main controller
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  enabled: true
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

# Service account configuration
serviceAccount:
  create: true
  name: "external-secrets"

# Webhook configuration
webhook:
  create: true
  replicaCount: 1
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    enabled: true
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

# Certificate controller configuration
certController:
  create: true
  replicaCount: 1
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    enabled: true
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

# Prometheus metrics
serviceMonitor:
  enabled: false
