name: external-secrets-operator
project: default
annotations:
  argocd.argoproj.io/sync-wave: "5"
source:
  repoURL: https://charts.external-secrets.io
  targetRevision: 0.10.8
  chart: external-secrets
  helm:
    releaseName: external-secrets
    values: |
      installCRDs: true

      replicaCount: 1

      image:
        repository: ghcr.io/external-secrets/external-secrets
        pullPolicy: IfNotPresent

      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi

      podSecurityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534

      serviceAccount:
        create: true
        name: external-secrets

      webhook:
        create: true
        port: 9443
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi

      certController:
        create: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi

      prometheus:
        enabled: true
        service:
          port: 8080

      extraArgs:
        - --concurrent=10
destination:
  server: https://kubernetes.default.svc
  namespace: external-secrets-system
syncPolicy:
  # automated:
  #   prune: true
  #   selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
