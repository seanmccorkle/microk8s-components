---
# HashiCorp Vault Helm Chart Values
# Development mode configuration

global:
  enabled: true
  tlsDisable: true  # Enable TLS in production

injector:
  enabled: false  # Using External Secrets Operator instead

server:
  enabled: true

  # Development mode - DO NOT USE IN PRODUCTION
  dev:
    enabled: true
    devRootToken: "root"

  # For production, uncomment and configure:
  # dev:
  #   enabled: false
  # ha:
  #   enabled: true
  #   replicas: 3
  #   raft:
  #     enabled: true
  #     setNodeId: true
  #     config: |
  #       ui = true
  #       listener "tcp" {
  #         address = "[::]:8200"
  #         cluster_address = "[::]:8201"
  #       }
  #       storage "raft" {
  #         path = "/vault/data"
  #       }

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: null
    accessMode: ReadWriteOnce

  auditStorage:
    enabled: false

  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200

  ingress:
    enabled: false

  ui:
    enabled: true
    serviceType: ClusterIP

  securityContext:
    pod:
      fsGroup: 1000
      runAsGroup: 1000
    container:
      runAsNonRoot: true
      runAsUser: 100

ui:
  enabled: true
  serviceType: ClusterIP

csi:
  enabled: false
