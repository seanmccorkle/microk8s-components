apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: vault
    repo: https://helm.releases.hashicorp.com
    version: 0.28.1
    releaseName: vault
    namespace: vault
    valuesFile: values.yaml

resources:
  - manifests/serviceaccount.yaml
  - manifests/rbac.yaml
  - manifests/init-scripts-configmap.yaml
  - manifests/init-job.yaml
  - manifests/clustersecretstore.yaml
