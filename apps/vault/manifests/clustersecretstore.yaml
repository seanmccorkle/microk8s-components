---
# ClusterSecretStore for Vault (accessible from all namespaces)
# NOTE: Requires ESO CRDs to be installed first
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"  # KV v2 mount path
      version: "v2"   # KV version
      auth:
        # Use Kubernetes auth method (recommended)
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets-vault
            namespace: external-secrets-system
